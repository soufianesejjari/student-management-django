version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: musical_academy_db
    environment:
      POSTGRES_DB: musical_academy
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: musical_academy_backend
    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-dev-key-change-in-production"
      DATABASE_URL: "postgresql://academy:academy_password_dev@db:5432/musical_academy"
      ALLOWED_HOSTS: "*"
      NEXT_PUBLIC_API_URL: "http://localhost:8009/api"
    ports:
      - "8009:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./
      dockerfile: Dockerfile.frontend
    container_name: musical_academy_frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8009/api"
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app/app
      - ./components:/app/components
      - ./hooks:/app/hooks
      - ./lib:/app/lib
      - ./context:/app/context
    depends_on:
      - backend
    command: pnpm dev

volumes:
  postgres_data:
